language: es
tone_instructions: >-
  Sé breve. Prioriza bugs verificables. Acepta sugerencias de mantenibilidad con
  beneficio concreto. Evita preferencias personales, cambios cosméticos y
  hallazgos ya cubiertos por formatter, linter o CI.
early_access: false
inheritance: false
reviews:
  profile: quiet
  request_changes_workflow: false
  high_level_summary: false
  review_status: true
  review_progress: false
  commit_status: false
  fail_commit_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: false
  related_issues: false
  related_prs: false
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: false
  slop_detection:
    enabled: false
  path_filters:
    - "src/**/*.ts"
    - "src/**/*.tsx"
    - "src-tauri/**/*.rs"
    - "scripts/**/*.ts"
    - "*.config.ts"
    - "!**/*.d.ts"
    - "!src-tauri/target/**"
  path_instructions:
    - path: "**/*"
      instructions: >-
        Antes de juzgar, reconstruye el objetivo del cambio con la descripción
        del PR, los tests y las referencias accesibles. No inventes requisitos ni
        decisiones históricas si falta contexto. Compara base y head del PR;
        recorre el flujo normal y sus ramas de fallo leyendo callers, guards,
        contratos y archivos relacionados cuando el diff no alcance.
        Sólo reporta un fallo después de verificar cómo la ejecución llega a él
        y por qué las guardas o tests existentes no lo evitan. Si no puedes
        verificarlo, omite el hallazgo; plantea una pregunta concreta sólo si
        la incertidumbre impide entender el cambio. Revisa comentarios existentes
        y no repitas hallazgos ya discutidos o corregidos.
        Cada comentario debe indicar ubicación, impacto o beneficio concreto y
        una propuesta en la capa que corresponde. Para bugs, incluye el escenario
        reproducible. Usa helpers y patrones
        existentes; explica el tradeoff si la solución rompe un contrato o test.
        Prioriza estados durables inconsistentes ante fallos parciales, carreras,
        reintentos no idempotentes, contratos rotos, falta de autorización y
        cargas no acotadas o N+1 demostrables. Contrasta promesas del PR con el
        comportamiento real. Sugiere nombres más claros, simplificaciones o
        separación de responsabilidades cuando expliques cómo mejoran comprensión
        o mantenimiento, aunque no corrijan un bug. Prefiere pocos comentarios
        útiles; evita listas genéricas, elogios, preferencias personales, cambios
        cosméticos y aspectos que ya resuelve el formatter o linter.
    - path: "**/*.{ts,tsx}"
      instructions: >-
        Verifica diferencias entre checks nullish y booleanos, optional chaining
        que oculta datos obligatorios y assertions de tipos que permiten estados
        inválidos en runtime. En React, sigue cierres y callbacks async para
        detectar resultados obsoletos, updates tras desmontar y doble envío.
        Comprueba conversiones de datos en fronteras API sin transformar dos
        veces. Reporta estos patrones sólo con un flujo y efecto verificables,
        no como preferencias de tipado ni duplicados del compilador o ESLint.
    - path: "src/**"
      instructions: >-
        Prioriza pérdida de datos, carreras async y aislamiento entre tareas.
        Las mutaciones compartidas pasan por Operations. Los normalizadores de
        utils.ts deben conservar nuevos campos persistidos y admitir datos antiguos.
        Persiste tareas creadas antes del setup opcional; si falla el borrado en
        disco, conserva su registro. No sobrescribas notas del usuario ni expongas
        credenciales. Cambiar de tarea oculta o desacopla sesiones sin terminarlas.
        Mantén soporte multi-repo y guardas contra eventos de sesiones anteriores.
    - path: "src-tauri/**/*.rs"
      instructions: >-
        Prioriza pérdida de datos, fallos parciales, seguridad y diferencias macOS.
        La limpieza de Claude sólo elimina entradas propias con directorios
        ausentes, preserva configuraciones ajenas y escribe atómicamente.
        Las apps GUI usan open -a; los CLI usan shell_env y argumentos escapados.
        Cambiar de tarea no termina sesiones; cerrar, borrar y salir sí.
        Sólo el webview principal recibe capabilities. La limpieza auxiliar no
        debe convertir una operación exitosa en un error. Conserva notas y adjuntos.
    - path: "**/*.test.{ts,tsx}"
      instructions: >-
        Señala regresiones de comportamiento y casos de fallo relevantes que el
        test no detectaría. Verifica outcomes observables, incluidos estado durable
        y efectos ante fallos o reintentos. Comprueba que mocks demasiado amplios
        no oculten el fallo real y que las expectativas no puedan pasar sin ejecutar
        la rama que dicen cubrir. Prefiere verificación focalizada; no pidas la
        suite completa ni tests que sólo repliquen la implementación.
  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false
    base_branches: []
    ignore_title_keywords: ["[skip review]"]
  pre_merge_checks:
    docstrings:
      mode: off
    title:
      mode: off
    description:
      mode: off
    issue_assessment:
      mode: off
    custom_checks: []
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []
  post_merge_actions: []
  tools:
    eslint:
      enabled: false
    clippy:
      enabled: false
    biome:
      enabled: false
    oxc:
      enabled: false
    semgrep:
      enabled: false
    opengrep:
      enabled: false
    actionlint:
      enabled: false
    zizmor:
      enabled: false
    github-checks:
      enabled: false
chat:
  auto_reply: false
  art: false
