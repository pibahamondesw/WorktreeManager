[advisories]
ignore = [
  { id = "RUSTSEC-2026-0194", reason = "Tauri's plist 1.8 dependency constrains quick-xml to 0.38" },
  { id = "RUSTSEC-2026-0195", reason = "Tauri's plist 1.8 dependency constrains quick-xml to 0.38" },
]
unmaintained = "workspace"

[licenses]
confidence-threshold = 0.8
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "simplest-path"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
