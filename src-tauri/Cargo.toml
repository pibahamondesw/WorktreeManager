[package]
name = "worktree-manager"
version = "0.39.0"
description = "Desktop worktree manager with Linear and GitHub integration"
authors = ["Pedro Bahamondez"]
license = "MIT"
repository = "https://github.com/pibahamondesw/WorktreeManager"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[test]]
name = "menu"
harness = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[dependencies]
serde_json = "1"
md5 = "0.8"
uuid = { version = "1", features = ["v4"] }
keyring = "4"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
portable-pty = "0.9"
libc = "0.2"
tokio = { version = "1", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "blocking"] }
sha2 = "0.10"
base64 = "0.22"
toml = "0.9"
similar = "2.7"
jsonc-parser = { version = "0.34", features = ["serde"] }
serde_norway = "0.9"
croner = { version = "4", default-features = false, features = ["jiff"] }
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
jsonschema = { version = "0.33.0", default-features = false }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSError", "NSString", "NSUserNotification"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Networking_WinSock", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Threading"] }
windows = { version = "0.61", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
uds_windows = "1.1.0"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
