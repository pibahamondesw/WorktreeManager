name: Release

# Pushing a tag like `v0.2.0` (see `pnpm run release`) builds the macOS app,
# publishes a GitHub Release with the DMG + updater artifacts + latest.json,
# then bumps the Homebrew cask in pibahamondesw/homebrew-tap.
on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Build & publish macOS release
    runs-on: macos-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Tags can only restore caches saved by trusted main builds, not by PRs.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0 # zizmor: ignore[cache-poisoning]
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        with:
          workspaces: src-tauri
          # Tag-scoped caches are invisible to later tags; release-cache.yml warms
          # this key on main, which tags can restore.
          shared-key: macos-release
          save-if: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build, sign updater artifacts, and publish release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # tauri-action looks for artifacts under src-tauri/target. The `tauri`
          # npm script otherwise redirects the build to a shared local cache dir,
          # which makes the bundle land somewhere the action never inspects.
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
          # Updater signing (free, from `tauri signer generate`). Required so the
          # in-app updater will accept the downloaded build.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NOTE: Apple Developer ID signing + notarization is intentionally NOT
          # wired up yet. Do not add empty APPLE_* env vars here — Tauri treats a
          # *present but empty* APPLE_CERTIFICATE as "import this cert" and fails
          # the build. When you enroll, add these secrets AND set a real
          # `bundle.macOS.signingIdentity`, then reintroduce them here:
          #   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WorktreeManager ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install. The app auto-updates after install."
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: --target universal-apple-darwin

  update-tap:
    name: Bump Homebrew cask
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    env:
      # Fine-grained PAT with contents:write on pibahamondesw/homebrew-tap.
      # If unset, this job no-ops (bump the cask by hand for now).
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - name: Compute version and DMG checksum
        if: ${{ env.TAP_TOKEN != '' }}
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ASSET="WorktreeManager_universal.app.tar.gz"
          URL="https://github.com/pibahamondesw/WorktreeManager/releases/download/${GITHUB_REF_NAME}/${ASSET}"
          curl -fsSL -o "$ASSET" "$URL"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$ASSET" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Checkout tap
        if: ${{ env.TAP_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pibahamondesw/homebrew-tap
          token: ${{ env.TAP_TOKEN }}
          persist-credentials: true
          path: tap

      - name: Rewrite cask and push
        if: ${{ env.TAP_TOKEN != '' }}
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
        run: |
          CASK=tap/Casks/worktreemanager.rb
          python3 - "$CASK" <<'PY'
          import pathlib, sys
          path = pathlib.Path(sys.argv[1])
          contents = path.read_text()
          if 'target: "wtm"' not in contents:
              contents = contents.replace('  app "WorktreeManager.app"', '  app "WorktreeManager.app"\n  binary "#{appdir}/WorktreeManager.app/Contents/MacOS/worktree-manager", target: "wtm"')
              path.write_text(contents)
          PY
          sed -i -E "s/  version \"[^\"]+\"/  version \"${VERSION}\"/" "$CASK"
          sed -i -E "s/  sha256 \"[^\"]+\"/  sha256 \"${SHA256}\"/" "$CASK"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/worktreemanager.rb
          git commit -m "worktreemanager ${VERSION}"
          git push
