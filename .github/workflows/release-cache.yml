name: Release cache

# Release runs on tags, whose caches later tags can't read. Building the same
# release on main saves a dependency cache every tag can restore.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/release-cache.yml"
      - ".github/workflows/release.yml"
  # GitHub evicts caches unused for 7 days and stable Rust changes every 6 weeks.
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions: {}

jobs:
  warm:
    name: Warm macOS release cache
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          shared-key: macos-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release binaries
        run: pnpm tauri build --target universal-apple-darwin --no-bundle
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
