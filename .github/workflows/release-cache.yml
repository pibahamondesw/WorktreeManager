name: Release cache

# Release runs on tags, whose caches later tags can't read. Building the same
# release on main saves a dependency cache every tag can restore.
on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/release-cache.yml"
      - ".github/workflows/release.yml"
  # GitHub evicts caches unused for 7 days and stable Rust changes every 6 weeks.
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:

concurrency:
  group: release-cache
  cancel-in-progress: true

permissions: {}

jobs:
  warm:
    name: Warm macOS release cache
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          shared-key: macos-release

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release binaries
        run: pnpm tauri build --target universal-apple-darwin --no-bundle
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
