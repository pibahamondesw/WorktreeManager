name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sast: ${{ steps.filter.outputs.sast }}
      workflow_security: ${{ steps.filter.outputs.workflow_security }}
      workflow_lint: ${{ steps.filter.outputs.workflow_lint }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.vault_kit == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # "every": a file counts for a filter only if it matches all of its patterns,
          # which lets `frontend` mean "anything outside Rust files".
          predicate-quantifier: every
          filters: |
            frontend:
              - '**'
              - '!src-tauri/**'
              - '!deny.toml'
            sast:
              - '{src/**,src-tauri/src/**,.semgrep/**,.github/workflows/ci.yml}'
            workflow_security:
              - '{.github/workflows/**,.zizmor/**}'
            workflow_lint:
              - '{.github/workflows/**,.actionlint/**}'
            rust:
              - '{src-tauri/**,deny.toml}'
            vault_kit:
              - 'vault-kit/**'
            workflow:
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up to date
        run: |
          pnpm install --lockfile-only
          if ! git diff --exit-code; then
            echo "::error::pnpm-lock.yaml is out of date (see diff above). Run 'pnpm install' locally and commit the updated pnpm-lock.yaml."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint:ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unused code and dependencies
        run: pnpm run knip

      - name: Test
        run: pnpm test

  frontend-coverage:
    name: Frontend coverage (pilot report)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure critical frontend coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust (clippy, fmt, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            python3-venv \
            build-essential \
            zsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          # PRs reuse main's cache instead of saving ~1 GB each and evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dependency-policy:
    name: Rust dependency policy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: src-tauri/Cargo.toml
          rust-version: stable

  sast:
    name: Semgrep
    needs: changes
    if: needs.changes.outputs.sast == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .semgrep/requirements.txt

      - name: Install Semgrep CE
        run: pip install -r .semgrep/requirements.txt

      - name: Test rules
        run: semgrep --test --metrics=off --config .semgrep/rules .semgrep/tests

      - name: Scan
        run: semgrep scan --metrics=off --config .semgrep/rules --error src src-tauri/src

  workflow-lint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflow_lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install actionlint and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          shellcheck --version

      - name: Test fixtures
        run: |
          actionlint -pyflakes= -shellcheck=shellcheck .actionlint/tests/valid.yml
          findings="$RUNNER_TEMP/actionlint-findings.json"
          if actionlint -pyflakes= -shellcheck=shellcheck -format '{{json .}}' .actionlint/tests/invalid.yml > "$findings"; then
            echo "::error::actionlint accepted the invalid fixture"
            exit 1
          fi
          for kind in expression action job-needs shellcheck; do
            if ! jq -e --arg kind "$kind" 'any(.[]; .kind == $kind)' "$findings" > /dev/null; then
              echo "::error::actionlint did not report $kind in the invalid fixture"
              cat "$findings"
              exit 1
            fi
          done

      - name: Scan all workflows
        run: time actionlint -pyflakes= -shellcheck=shellcheck

  workflow-security:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.workflow_security == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .zizmor/requirements.txt

      - name: Install zizmor
        run: pip install -r .zizmor/requirements.txt

      - name: Test fixtures
        run: |
          zizmor --offline .zizmor/tests/secure.yml
          findings=$(zizmor --offline --format json .zizmor/tests/insecure.yml || true)
          for audit in artipacked dangerous-triggers excessive-permissions template-injection unpinned-uses; do
            if ! jq -e --arg audit "$audit" 'any(.[]; .ident == $audit)' <<< "$findings" > /dev/null; then
              echo "::error::zizmor did not report $audit in .zizmor/tests/insecure.yml"
              exit 1
            fi
          done

      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows
