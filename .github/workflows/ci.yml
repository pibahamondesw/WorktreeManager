name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.vault_kit == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # "every": a file counts for a filter only if it matches all of its patterns,
          # which lets `frontend` mean "anything outside Rust files".
          predicate-quantifier: every
          filters: |
            frontend:
              - '**'
              - '!src-tauri/**'
              - '!deny.toml'
            rust:
              - 'src-tauri/**'
              - 'deny.toml'
            vault_kit:
              - 'vault-kit/**'
            workflow:
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up to date
        run: |
          pnpm install --lockfile-only
          if ! git diff --exit-code; then
            echo "::error::pnpm-lock.yaml is out of date (see diff above). Run 'pnpm install' locally and commit the updated pnpm-lock.yaml."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint:ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

  rust:
    name: Rust (clippy, fmt, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            python3-venv \
            build-essential

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # PRs reuse main's cache instead of saving ~1 GB each and evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: cargo clippy --all-targets --manifest-path src-tauri/Cargo.toml

      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  dependency-policy:
    name: Rust dependency policy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: src-tauri/Cargo.toml
          rust-version: stable
