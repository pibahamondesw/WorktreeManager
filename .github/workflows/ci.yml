name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel in-progress runs for the same branch/PR to save minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      sast: ${{ steps.filter.outputs.sast }}
      workflow_security: ${{ steps.filter.outputs.workflow_security }}
      workflow_lint: ${{ steps.filter.outputs.workflow_lint }}
      frontend: ${{ steps.filter.outputs.frontend }}
      rust: ${{ steps.filter.outputs.rust == 'true' || steps.filter.outputs.vault_kit == 'true' || steps.filter.outputs.workflow == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # "every": a file counts for a filter only if it matches all of its patterns,
          # which lets `frontend` mean "anything outside Rust files".
          predicate-quantifier: every
          filters: |
            frontend:
              - '**'
              - '!src-tauri/**'
              - '!deny.toml'
            sast:
              - '{src/**,src-tauri/src/**,.semgrep/**,.github/workflows/ci.yml}'
            workflow_security:
              - '{.github/workflows/**,.zizmor/**}'
            workflow_lint:
              - '{.github/workflows/**,.actionlint/**}'
            rust:
              - '{src-tauri/**,deny.toml,scripts/rust-coverage.sh,scripts/rust-coverage-report.py,scripts/coverage-requirements.txt}'
            vault_kit:
              - 'vault-kit/**'
            workflow:
              - '.github/workflows/ci.yml'

  frontend:
    name: Frontend (lint, typecheck, test)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile is up to date
        run: |
          pnpm install --lockfile-only
          if ! git diff --exit-code; then
            echo "::error::pnpm-lock.yaml is out of date (see diff above). Run 'pnpm install' locally and commit the updated pnpm-lock.yaml."
            exit 1
          fi

      - name: Lint
        run: pnpm run lint:ts

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unused code and dependencies
        run: pnpm run knip

      - name: Test
        run: pnpm test

  frontend-coverage:
    name: Frontend coverage (pilot report)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Measure critical frontend coverage
        run: pnpm run test:coverage

      - name: Upload coverage reports
        if: ${{ !cancelled() && hashFiles('coverage/coverage-summary.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: coverage/
          if-no-files-found: error
          retention-days: 7

  rust:
    name: Rust (clippy, fmt, test)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            python3-venv \
            build-essential \
            zsh

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          # PRs reuse main's cache instead of saving ~1 GB each and evicting it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Clippy
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/linux-clippy.txt" \
            cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Report Clippy timing
        if: ${{ !cancelled() }}
        run: |
          if [ -f "$RUNNER_TEMP/linux-clippy.txt" ]; then
            {
              printf '### Linux clippy\n```text\n'
              cat "$RUNNER_TEMP/linux-clippy.txt"
              printf '```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  rust-macos:
    name: Rust (macOS, clippy, native tests)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target/pr-macos
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt

      - name: Cache macOS PR build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target/pr-macos
          key: macos-pr
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Compile and lint macOS targets
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/macos-clippy.txt" \
            cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Format check
        run: cargo fmt --all --manifest-path src-tauri/Cargo.toml -- --check

      - name: Focused macOS unit tests
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/macos-unit.txt" \
            cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- \
              commands::login_shell::tests:: \
              commands::agent_notifications::tests:: \
              commands::embedded:: \
              menu::tests::

      - name: Native WebKit and menu regression
        run: |
          /usr/bin/time -p -o "$RUNNER_TEMP/macos-menu.txt" \
            cargo test --locked --manifest-path src-tauri/Cargo.toml --test menu

      - name: Report macOS timings
        if: ${{ !cancelled() }}
        run: |
          for phase in clippy unit menu; do
            report="$RUNNER_TEMP/macos-$phase.txt"
            if [ -f "$report" ]; then
              {
                printf '### macOS %s\n```text\n' "$phase"
                cat "$report"
                printf '```\n'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
          done

  rust-coverage:
    name: Rust coverage (macOS, new lines)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
      RUSTFLAGS: --remap-path-prefix=tests/../src=src
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned Rust and LLVM tools
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install diff-cover
        run: pip install -r scripts/coverage-requirements.txt

      - name: Install cargo-llvm-cov
        run: |
          archive="$RUNNER_TEMP/cargo-llvm-cov.tar.gz"
          curl -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/download/v0.9.1/cargo-llvm-cov-aarch64-apple-darwin.tar.gz -o "$archive"
          echo "7e821a6c90c0884f79f759f5d9be50799ade67bb82515186d922f26032ef43b8  $archive" | shasum -a 256 --check
          mkdir -p "$RUNNER_TEMP/coverage-tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/coverage-tools" cargo-llvm-cov
          echo "$RUNNER_TEMP/coverage-tools" >> "$GITHUB_PATH"

      - name: Cache Rust coverage build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target/llvm-cov-pilot
          key: coverage-macos-llvm-cov-0.9.1
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'pull_request' }}

      - name: Measure focused Rust coverage
        env:
          COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: sh scripts/rust-coverage.sh

      - name: Upload coverage and timing reports
        if: ${{ !cancelled() && hashFiles('coverage/rust/macos/toolchain.txt') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-coverage-macos
          path: coverage/rust/macos/
          if-no-files-found: error
          retention-days: 7

  dependency-policy:
    name: Rust dependency policy
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl -fsSL https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz -o "$archive"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/dependency-policy-tools"
          tar -xzf "$archive" --strip-components=1 -C "$RUNNER_TEMP/dependency-policy-tools" cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny
          echo "$RUNNER_TEMP/dependency-policy-tools" >> "$GITHUB_PATH"

      - name: Check Rust dependency policy
        run: cargo deny --log-level warn --manifest-path src-tauri/Cargo.toml --all-features check

  sast:
    name: Semgrep
    needs: changes
    if: needs.changes.outputs.sast == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .semgrep/requirements.txt

      - name: Install Semgrep CE
        run: pip install -r .semgrep/requirements.txt

      - name: Test rules
        run: semgrep --test --metrics=off --config .semgrep/rules .semgrep/tests

      - name: Scan
        run: semgrep scan --metrics=off --config .semgrep/rules --error src src-tauri/src

  workflow-lint:
    name: actionlint
    needs: changes
    if: needs.changes.outputs.workflow_lint == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint and ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          shellcheck --version

      - name: Test fixtures
        run: |
          actionlint -pyflakes= -shellcheck=shellcheck .actionlint/tests/valid.yml
          findings="$RUNNER_TEMP/actionlint-findings.json"
          if actionlint -pyflakes= -shellcheck=shellcheck -format '{{json .}}' .actionlint/tests/invalid.yml > "$findings"; then
            echo "::error::actionlint accepted the invalid fixture"
            exit 1
          fi
          for kind in expression action job-needs shellcheck; do
            if ! jq -e --arg kind "$kind" 'any(.[]; .kind == $kind)' "$findings" > /dev/null; then
              echo "::error::actionlint did not report $kind in the invalid fixture"
              cat "$findings"
              exit 1
            fi
          done

      - name: Scan all workflows
        run: time actionlint -pyflakes= -shellcheck=shellcheck

  workflow-security:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.workflow_security == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .zizmor/requirements.txt

      - name: Install zizmor
        run: pip install -r .zizmor/requirements.txt

      - name: Test fixtures
        run: |
          zizmor --offline .zizmor/tests/secure.yml
          findings=$(zizmor --offline --format json .zizmor/tests/insecure.yml || true)
          for audit in artipacked dangerous-triggers excessive-permissions template-injection unpinned-uses; do
            if ! jq -e --arg audit "$audit" 'any(.[]; .ident == $audit)' <<< "$findings" > /dev/null; then
              echo "::error::zizmor did not report $audit in .zizmor/tests/insecure.yml"
              exit 1
            fi
          done

      - name: Scan
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format github .github/workflows
